<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <!-- Top: DE € 97 -->
  <text x="140" y="45" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#000000" text-anchor="end">DE</text>
  <text x="155" y="45" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ff0000" text-anchor="start">€ 97</text>
  <!-- Red Strikethrough line -->
  <line x1="145" y1="34" x2="265" y2="34" stroke="#ff0000" stroke-width="4" stroke-linecap="round" />

  <!-- Middle: POR APENAS -->
